name: Signing integration

on:
  push:
    branches: [master, main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  sign-and-notarize:
    # This environment must be protected. It contains the service-account token
    # that can retrieve the shared DDEV Developer ID private key.
    environment: signing
    runs-on: macos-26
    env:
      APPLE_ID: "${{ vars.APPLE_ID }}"
      CERTNAME: "Developer ID Application: DDEV Foundation (9HQ298V2BW)"
      TEAM_ID: "9HQ298V2BW"
    steps:
      - uses: actions/checkout@v6
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - uses: actions/setup-go@v6
        with:
          go-version: '>=1.23'
          check-latest: true
          cache: false
      - name: Load notarization secrets
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: "${{ secrets.TESTS_SERVICE_ACCOUNT_TOKEN }}"
          APP_SPECIFIC_PASSWORD: "op://test-secrets/SIGNING_TOOLS_APP_SPECIFIC_PASSWORD/credential"
      - name: Load signing-certificate password
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: "${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}"
          SIGNING_TOOLS_SIGNING_PASSWORD: "op://ddev-signing/2prggopnzml4kqotzzs3dgcsr4/certificate_password"
      - name: Install dependencies
        run: |
          brew install bats-core bats-core/bats-core/bats-assert bats-core/bats-core/bats-file bats-core/bats-core/bats-support gnu-getopt jq xq yq
      - name: Test signing and notarization
        env:
          OP_SERVICE_ACCOUNT_TOKEN: "${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}"
        run: |
          set -euo pipefail
          cert_dir=$(mktemp -d "${TMPDIR:-/tmp}/ddev-signing-cert.XXXXXXXX")
          cert_file="$cert_dir/ddev-developer-id-2026.p12"
          trap 'rm -rf "$cert_dir"' EXIT
          op read --out-file "$cert_file" "op://ddev-signing/2prggopnzml4kqotzzs3dgcsr4/ddev-developer-id-2026.p12"
          chmod 600 "$cert_file"
          export CERTFILE="$cert_file"
          for item in tests/*.bats; do
            echo "Running ${item}"
            bats "$item"
          done
